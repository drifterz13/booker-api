[project]
name = "booker-api"
version = "0.1.0"
requires-python = ">=3.11.4,<3.14"
dependencies = [
    "boto3>=1.43.104",
    "chainlit>=2.12.0",
    "chromadb>=1.5.9",
    "fastapi[standard]>=0.141.1",
    "langchain>=1.4.2",
    "langchain-openai>=1.6.6",
    "langchain-text-splitters>=1.1.2",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "sqlmodel>=0.0.47",
]

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.fastapi]
entrypoint = "app.main:app"
