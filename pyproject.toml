[project]
name = "booker-api"
version = "0.1.0"
requires-python = ">=3.11.4,<3.14"
dependencies = [
    "chainlit>=2.12.0",
    "chromadb>=1.5.9",
    "langchain>=1.4.2",
    "langchain-openai>=1.6.6",
    "langchain-text-splitters>=1.1.2",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""
